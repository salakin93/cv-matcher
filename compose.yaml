services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

  backend:
    build:
      context: ./cv-matcher-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8080/oauth2/callback/microsoft}
      OAUTH_TOKEN_ENCRYPTION_KEY: ${OAUTH_TOKEN_ENCRYPTION_KEY:-}
      CV_DOCUMENT_ENCRYPTION_KEY: ${CV_DOCUMENT_ENCRYPTION_KEY:-}
      CV_ARTIFACT_DIRECTORY: /var/lib/cv-matcher/artifacts
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
    volumes:
      - cv-artifacts:/var/lib/cv-matcher/artifacts
    networks:
      - internal

  clamav:
    image: clamav/clamav:1.4_base
    restart: unless-stopped
    networks:
      - internal

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

volumes:
  postgres-data:
  cv-artifacts:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
