app:
  outlook:
    tenant-id: test-tenant
    client-id: test-client
    client-secret: test-client-secret
    authority: http://localhost:18080
    redirect-uri: http://localhost:6060/api/v1/admin/integrations/outlook/callback
    app-base-url: http://localhost:5173
    token-encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    token-encryption-key-version: 1
    connect-timeout: 1s
    read-timeout: 1s
    max-retries: 3
    max-retry-after: 1s
    graph-base-uri: http://localhost:18081
  job:
    discovery:
      enabled: false
      poll-delay: 1s
      lease-duration: 1m
      connect-timeout: 1s
      read-timeout: 1s
      max-retries: 3
      page-size: 50
      max-messages-per-job: 5000
    documents:
      enabled: false
      poll-delay: 1s
      lease-duration: 1m
      max-document-bytes: 10485760
      max-documents-per-job: 200
      max-bytes-per-job: 262144000
      max-attachments-per-message: 20
      storage-root: ${java.io.tmpdir}/cv-matcher-test-documents
      encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      encryption-key-version: 1
      antivirus-mode: clean
      antivirus-host: localhost
      antivirus-port: 3310
      antivirus-timeout: 1s
  security:
    secure-cookies: false
  cors:
    allowed-origins: http://localhost:5173
