spring:
  application:
    name: cv-matcher-backend
  config:
    # Supports running from either the repository root or the backend module.
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5430/cv-matcher}
    username: ${DB_USERNAME:salaco}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:6060}

logging:
  structured:
    format:
      console: logstash

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-signing-key: ${JWT_SIGNING_KEY}
    secure-cookies: ${SECURE_COOKIES:false}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    session-hours: ${SESSION_HOURS:8}
    verification-hours: ${VERIFICATION_HOURS:24}
    verification-resend-limit: ${VERIFICATION_RESEND_LIMIT:3}
    verification-resend-window-seconds: ${VERIFICATION_RESEND_WINDOW_SECONDS:3600}
    outbox-encryption-key: ${IDENTITY_OUTBOX_ENCRYPTION_KEY}
    outbox-encryption-key-version: ${IDENTITY_OUTBOX_ENCRYPTION_KEY_VERSION:1}
    login-max-failed-attempts: ${LOGIN_MAX_FAILED_ATTEMPTS:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    password-reset-minutes: ${PASSWORD_RESET_MINUTES:30}
    password-reset-request-limit: ${PASSWORD_RESET_REQUEST_LIMIT:3}
    password-reset-request-window-seconds: ${PASSWORD_RESET_REQUEST_WINDOW_SECONDS:3600}
    email-change-hours: ${EMAIL_CHANGE_HOURS:24}
    email-change-resend-limit: ${EMAIL_CHANGE_RESEND_LIMIT:3}
    email-change-resend-window-seconds: ${EMAIL_CHANGE_RESEND_WINDOW_SECONDS:3600}
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:}
    initial-admin-password: ${INITIAL_ADMIN_PASSWORD:}
